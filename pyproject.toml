[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-rag"
version = "0.1.0"
description = "Grounded Q&A over Dübendorf Gemeinderat meeting recordings and minutes"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6",
  "numpy>=1.24",
  "pypdf>=4",
  "yt-dlp>=2024.10",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# faster-whisper (CTranslate2): recommended on CPU and on CUDA GPUs
transcribe = ["faster-whisper>=1.0.3", "huggingface_hub>=0.23"]
# only needed for `gr-rag convert-model` or the transformers backend
convert = ["ctranslate2>=4.3", "transformers>=4.40", "torch"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gr-rag = "gr_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
